<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rock Paper Scissors</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game-container">

        <h1>Rock Paper Scissors</h1>

        <p class="subtitle">
            Apna option select karo
        </p>

        <!-- Score board -->
        <section class="score-board">

            <div class="score-box">
                <h2>Player</h2>
                <span id="playerScore">0</span>
            </div>

            <div class="score-box">
                <h2>Computer</h2>
                <span id="computerScore">0</span>
            </div>

        </section>

        <!-- Game choices -->
        <section class="choices">

            <button class="choice-btn" data-choice="rock" aria-label="Choose Rock">
                <span class="emoji">✊</span>
                <span>Rock</span>
            </button>

            <button class="choice-btn" data-choice="paper" aria-label="Choose Paper">
                <span class="emoji">✋</span>
                <span>Paper</span>
            </button>

            <button class="choice-btn" data-choice="scissors" aria-label="Choose Scissors">
                <span class="emoji">✌️</span>
                <span>Scissors</span>
            </button>

        </section>

        <!-- Player aur computer choice -->
        <section class="result-area">

            <div class="selected-choice">
                <p>Aapne chuna</p>
                <span id="playerChoice">❔</span>
            </div>

            <div class="versus">VS</div>

            <div class="selected-choice">
                <p>Computer ne chuna</p>
                <span id="computerChoice">❔</span>
            </div>

        </section>

        <!-- Result message -->
        <p id="resultMessage">
            Game start karne ke liye koi option select karo.
        </p>

        <button id="restartBtn">
            Restart Game
        </button>

    </main>

    <script src="script.js"></script>

</body>

</html>
